name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag (e.g. v0.4.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write   # needed only to publish a GitHub Release
  actions: read     # lets SignPath read this run's artifacts

# Code signing through SignPath runs only after the repository variable
# SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN are set
# (see docs/CODE_SIGNING.md). Without them the build stays unsigned.
env:
  SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && github.event_name != 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Version
        id: ver
        run: |
          $v = python -c "import phraseforge; print(phraseforge.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "PhraseForge $v"

      - name: Run tests
        env:
          PHRASEFORGE_HOME: ${{ runner.temp }}\pf-tests
        run: python -m pytest -q -p no:cacheprovider

      - name: Build icon
        run: python packaging/make_icon.py

      - name: Build EXE (folder, for the installer)
        run: pyinstaller --noconfirm packaging/phraseforge.spec

      - name: Build portable single-file EXE
        env:
          PF_ONEFILE: "1"
        run: pyinstaller --noconfirm packaging/phraseforge.spec

      - name: Upload unsigned EXEs for signing
        id: unsigned-exe
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: |
            dist/B-PhraseForgeExpress/B-PhraseForgeExpress.exe
            dist/B-PhraseForgeExpress-portable.exe
          if-no-files-found: error

      - name: Sign EXEs (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'B-PhraseForgeExpress' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-exe

      - name: Put the signed EXEs in place
        if: env.SIGN == 'true'
        run: |
          Copy-Item signed-exe\B-PhraseForgeExpress\B-PhraseForgeExpress.exe dist\B-PhraseForgeExpress\ -Force
          Copy-Item signed-exe\B-PhraseForgeExpress-portable.exe dist\ -Force
          foreach ($f in @("dist\B-PhraseForgeExpress\B-PhraseForgeExpress.exe", "dist\B-PhraseForgeExpress-portable.exe")) {
            $sig = Get-AuthenticodeSignature $f
            Write-Host "$f : $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne "Valid") { throw "$f is not validly signed" }
          }

      - name: Self-test the EXEs
        run: |
          foreach ($exe in @("dist\B-PhraseForgeExpress\B-PhraseForgeExpress.exe", "dist\B-PhraseForgeExpress-portable.exe")) {
            $home_dir = Join-Path $env:RUNNER_TEMP ("st-" + [IO.Path]::GetFileNameWithoutExtension($exe))
            $env:PHRASEFORGE_HOME = $home_dir
            $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
            Get-Content (Join-Path $home_dir "selftest.txt")
            if ($p.ExitCode -ne 0) { throw "$exe self-test failed (exit $($p.ExitCode))" }
          }

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build Setup.exe
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Upload unsigned Setup for signing
        id: unsigned-setup
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: dist/B-PhraseForgeExpress-Setup-${{ steps.ver.outputs.version }}.exe
          if-no-files-found: error

      - name: Sign Setup (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'B-PhraseForgeExpress' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: setup
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-setup

      - name: Put the signed Setup in place
        if: env.SIGN == 'true'
        run: |
          $f = "dist\B-PhraseForgeExpress-Setup-${{ steps.ver.outputs.version }}.exe"
          Copy-Item "signed-setup\$(Split-Path $f -Leaf)" $f -Force
          $sig = Get-AuthenticodeSignature $f
          Write-Host "$f : $($sig.Status) $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne "Valid") { throw "$f is not validly signed" }

      - name: Test silent install, self-test and uninstall
        run: |
          $setup = "dist\B-PhraseForgeExpress-Setup-${{ steps.ver.outputs.version }}.exe"
          $dir = Join-Path $env:RUNNER_TEMP "PhraseForgeInstall"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$dir`"", "/TASKS=autostart" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Setup failed (exit $($p.ExitCode))" }
          $run = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run").PhraseForge
          Write-Host "Run key: $run"
          if (-not $run) { throw "autostart value missing" }
          $env:PHRASEFORGE_HOME = Join-Path $env:RUNNER_TEMP "st-installed"
          $p = Start-Process "$dir\B-PhraseForgeExpress.exe" -ArgumentList "--self-test" -Wait -PassThru
          Get-Content "$env:PHRASEFORGE_HOME\selftest.txt"
          if ($p.ExitCode -ne 0) { throw "installed self-test failed" }
          $p = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall failed (exit $($p.ExitCode))" }
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\B-PhraseForgeExpress.exe") { throw "uninstall left B-PhraseForgeExpress.exe behind" }
          $run = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -ErrorAction SilentlyContinue).PhraseForge
          if ($run) { throw "uninstall left the autostart value" }

      - name: Package portable zip
        run: |
          Compress-Archive -Path dist\B-PhraseForgeExpress\* -DestinationPath "dist\B-PhraseForgeExpress-${{ steps.ver.outputs.version }}-win64.zip"
          Get-ChildItem dist -File | Select-Object Name, @{n="MB";e={[math]::Round($_.Length/1MB,1)}}

      - uses: actions/upload-artifact@v4
        with:
          name: B-PhraseForgeExpress-${{ steps.ver.outputs.version }}-windows
          path: |
            dist/B-PhraseForgeExpress-Setup-*.exe
            dist/B-PhraseForgeExpress-portable.exe
            dist/B-PhraseForgeExpress-*-win64.zip
          if-no-files-found: error

      - name: Publish GitHub Release (v* tag, or manual run with release_tag)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
        uses: softprops/action-gh-release@v2
        with:
          # a manual run creates the tag on the commit it built
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: B-PhraseForgeExpress ${{ inputs.release_tag || github.ref_name }}
          files: |
            dist/B-PhraseForgeExpress-Setup-*.exe
            dist/B-PhraseForgeExpress-portable.exe
            dist/B-PhraseForgeExpress-*-win64.zip
          generate_release_notes: true
